name: Diagnostic app build

# Explicitly requested one-off development build; never a release entry point.
on:
  push:
    branches: [codex/volume-input-source-feedback]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      UNIVERSAL_BUILD: '0'
      CODE_SIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and build contracts
        run: bash scripts/verify-local.sh full
      - name: Build isolated development app
        run: bash scripts/build-worktree.sh release no-open
      - name: Zip app and record provenance
        run: |
          set -euo pipefail
          git rev-parse HEAD > dist/source-sha.txt
          ditto -c -k --sequesterRsrc --keepParent dist/StatusTrio.app dist/StatusTrio-arm64-diagnostic.zip
          shasum -a 256 dist/StatusTrio-arm64-diagnostic.zip > dist/SHA256SUMS.txt
          {
            echo '## Diagnostic build'
            echo "Source: $(git rev-parse HEAD)"
            echo 'Architecture: arm64; signing: Ad-hoc; notarization: NOT RUN.'
            echo 'No release, tag, DMG or appcast was created.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: StatusTrio-arm64-diagnostic
          path: |
            dist/StatusTrio-arm64-diagnostic.zip
            dist/source-sha.txt
            dist/SHA256SUMS.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-verification
          path: .build/local-verification/
          retention-days: 7
          if-no-files-found: ignore
